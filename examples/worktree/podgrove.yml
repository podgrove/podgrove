# Copy to each application worktree and replace these three target values.
# Generate/apply a separate bootstrap folder from each worktree before up.
version: 1
cluster:
  context: your-development-context
  namespace: your-development-namespace
  namespace_mode: worktree
  storage_class: your-delete-storage-class
# Omitted compose.files uses standard Compose base/override discovery.
# If the project has a specific invocation, preserve its exact ordered files.
node_mode: shared
ttl: 8h
