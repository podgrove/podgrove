[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "podgrove"
version = "0.4.0"
description = "Run unchanged Compose worktrees on isolated Kubernetes Docker engines"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Farhaan Patel"}]
keywords = ["kubernetes", "docker", "compose", "worktree", "development"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["PyYAML>=6.0.2,<7", "jsonschema>=4.23,<5"]

[project.urls]
Homepage = "https://podgrove.github.io/podgrove/"
Documentation = "https://podgrove.github.io/podgrove/getting-started/"
Repository = "https://github.com/podgrove/podgrove"
Issues = "https://github.com/podgrove/podgrove/issues"
Changelog = "https://github.com/podgrove/podgrove/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-timeout>=2,<3", "ruff>=0.11", "websockets>=14,<18"]
web-test = ["playwright>=1.50,<2"]

[project.scripts]
podgrove = "podgrove.cli:main"

[tool.setuptools]
packages = ["podgrove"]
include-package-data = false

[tool.setuptools.package-data]
podgrove = ["web_static/*.html", "web_static/*.css", "web_static/*.js", "web_static/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a disposable Docker engine", "cluster: requires the explicitly authorized Kubernetes namespace", "browser: requires Playwright and a disposable browser profile"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
