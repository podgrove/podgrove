name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Resume an existing stable draft/published release (vX.Y.Z); never creates a tag
        type: string
        required: true
      artifact_run_id:
        description: Original Release workflow run ID containing verified-release (reuse exact bytes)
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: release-podgrove
  cancel-in-progress: false

jobs:
  release-please:
    if: >-
      github.repository == 'podgrove/podgrove' &&
      github.ref == 'refs/heads/main' &&
      vars.RELEASE_AUTOMATION_ENABLED == 'true' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  resolve:
    needs: release-please
    if: >-
      always() && github.repository == 'podgrove/podgrove' &&
      github.ref == 'refs/heads/main' && vars.RELEASE_AUTOMATION_ENABLED == 'true' &&
      (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
      artifact_run_id: ${{ steps.resolve.outputs.artifact_run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Validate release identity and resolve exact commit
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: python scripts/resolve_release.py

  validate:
    needs: resolve
    if: ${{ !cancelled() && needs.resolve.result == 'success' }}
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  build:
    needs: [resolve, validate]
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.18'
          enable-cache: false
      - run: uv lock --check
      - name: Build once for publication
        run: uv build --no-sources --build-constraint .github/build-constraints.txt --out-dir release-dist
      - name: Verify wheel, generate formula and seal checksums
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: python scripts/verify_release.py --dist release-dist --source-sha "$SOURCE_SHA" --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release
          path: release-dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [resolve, validate, build]
    if: >-
      !cancelled() && needs.resolve.result == 'success' && needs.validate.result == 'success' &&
      (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.build.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release
          path: release-dist/
          run-id: ${{ needs.resolve.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Upload without replacement, verify remote hashes, publish draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        run: python scripts/publish_release.py --dist release-dist --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA"

  homebrew-pr:
    needs: [resolve, publish]
    if: vars.HOMEBREW_TAP_REPOSITORY != ''
    runs-on: macos-latest
    environment: homebrew
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release
          path: release-dist/
          run-id: ${{ needs.resolve.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
          persist-credentials: false
      - name: Stage only the generated formula
        run: |
          mkdir -p tap/Formula
          cp release-dist/podgrove.rb tap/Formula/podgrove.rb
          ruby -c tap/Formula/podgrove.rb
      - name: Test installation on disposable runner
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew tap-new podgrove/verification
          cp tap/Formula/podgrove.rb "$(brew --repository)/Library/Taps/podgrove/homebrew-verification/Formula/podgrove.rb"
          brew install --build-from-source podgrove/verification/podgrove
          brew test podgrove/verification/podgrove
          brew audit --strict podgrove/verification/podgrove
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          branch: release/podgrove-v${{ needs.resolve.outputs.version }}
          commit-message: 'chore: release podgrove v${{ needs.resolve.outputs.version }}'
          title: 'chore: release podgrove v${{ needs.resolve.outputs.version }}'
          body: |
            Generated from the verified GitHub release sdist and its locked runtime dependency closure.
            All source downloads have SHA256 checksums. Source install, offline CLI smoke test and Homebrew audit passed on macOS.
            Review this PR and the release evidence before merging; no automatic merge is enabled.
          add-paths: Formula/podgrove.rb
